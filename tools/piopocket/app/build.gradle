plugins { id 'com.android.application' }
android {
    namespace 'cc.axymorrsen.piopocket'
    compileSdk 35
    defaultConfig {
        applicationId 'cc.axymorrsen.piopocket'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-ci'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.github.mik3y:usb-serial-for-android:3.11.0' }
